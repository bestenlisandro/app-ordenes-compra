services:
  - type: web
    name: app-ordenes-compra
    runtime: node
    plan: free
    buildCommand: npm install && npm run db:generate:render && npm run build
    startCommand: node server/prepareDatabase.js && npm run start:render
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: TAX_RATE
        value: "0.21"
      - key: DATABASE_URL
        sync: false
      - key: DATABASE_PURPOSE
        value: "compras"
      - key: AUTH_SECRET
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
